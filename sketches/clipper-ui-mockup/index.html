<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Clipper Customize</title>
<style id="localfonts">@font-face{font-family:'Anton';font-weight:400;font-display:swap;src:url('fonts/Anton-400.woff2') format('woff2')}@font-face{font-family:'Bebas Neue';font-weight:400;font-display:swap;src:url('fonts/BebasNeue-400.woff2') format('woff2')}@font-face{font-family:'Bungee';font-weight:400;font-display:swap;src:url('fonts/Bungee-400.woff2') format('woff2')}@font-face{font-family:'Inter';font-weight:700;font-display:swap;src:url('fonts/Inter-700.woff2') format('woff2')}@font-face{font-family:'Inter';font-weight:900;font-display:swap;src:url('fonts/Inter-900.woff2') format('woff2')}@font-face{font-family:'Montserrat';font-weight:900;font-display:swap;src:url('fonts/Montserrat-900.woff2') format('woff2')}@font-face{font-family:'Oswald';font-weight:700;font-display:swap;src:url('fonts/Oswald-700.woff2') format('woff2')}@font-face{font-family:'Poppins';font-weight:900;font-display:swap;src:url('fonts/Poppins-900.woff2') format('woff2')}@font-face{font-family:'Roboto Condensed';font-weight:900;font-display:swap;src:url('fonts/RobotoCondensed-900.woff2') format('woff2')}</style>
<style>
*{box-sizing:border-box}
:root{
 --bg:#0B1220;--bg2:#070C16;--panel:rgba(255,255,255,.045);--panel2:rgba(255,255,255,.07);
 --line:rgba(255,255,255,.10);--line2:rgba(255,255,255,.18);
 --text:#EAF2FF;--muted:#8FA5BF;--brand:#72E8FF;--brand2:#7C6BFF;--ok:#77F7B2;--warn:#FACC15;--bad:#FF8B8B;
 --r:14px;--r2:18px;
 --left-w: 240px;
}
html,body{height:100%}
body{margin:0;font-family:Inter,"Segoe UI",Arial,sans-serif;font-size:13px;color:var(--text);
 background:radial-gradient(1200px 500px at 15% -10%,rgba(114,232,255,.10),transparent 60%),
            radial-gradient(900px 420px at 85% -6%,rgba(124,107,255,.12),transparent 62%),
            linear-gradient(180deg,var(--bg),var(--bg2));overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
::-webkit-scrollbar{width:7px;height:7px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:9px}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.24)}

/* ---------- shell ---------- */
.wrap{height:100vh;display:flex;flex-direction:column;padding:12px 14px 14px;gap:10px}
.bar{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.bar .grow{flex:1}
.btn{border:1px solid var(--line);background:var(--panel2);border-radius:12px;padding:8px 13px;font-weight:800;font-size:12.5px;
 display:inline-flex;align-items:center;gap:7px;transition:.15s;white-space:nowrap}
.btn:hover{border-color:var(--line2);background:rgba(255,255,255,.11)}
.btn.pri{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#06101D;border-color:transparent;
 box-shadow:0 8px 26px rgba(114,232,255,.22)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.sm{padding:6px 10px;font-size:11.5px;border-radius:10px}
.btn.ico{padding:6px 8px}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.seg button{padding:6px 12px;border-radius:9px;font-weight:800;font-size:12px;color:var(--muted)}
.seg button.on{background:rgba(114,232,255,.16);color:#EAFAFF}

/* ---------- 3 columns ---------- */
.grid{flex:1;min-height:0;display:grid;grid-template-columns:minmax(255px,var(--left-w)) 6px minmax(300px,1fr) 320px;gap:6px;align-items:stretch}
.col{background:var(--panel);border:1px solid var(--line);border-radius:var(--r2);padding:10px;min-width:0;
 display:flex;flex-direction:column;gap:8px;overflow:hidden;height:100%}
.col.mid{background:radial-gradient(700px 380px at 50% 0,rgba(114,232,255,.07),transparent 65%),rgba(3,7,18,.55);
 align-items:center;padding:10px 10px 12px}
.scroll{overflow-y:auto;overflow-x:hidden;min-height:0;flex:1;padding-right:3px}
.row{display:flex;gap:6px}
.row>*{flex:1}
/* ---------- tiny toolbar (left col header) ---------- */
.chead{display:flex;align-items:center;gap:6px;flex:0 0 auto}
.chead .t{font-size:12px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:#C8D8EA;flex:1}
.chead .tslabel{font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;
 color:var(--muted);white-space:nowrap}
.thumb-sizes{display:flex;align-items:center;gap:3px}
.thumb-sizes .btn{width:24px;height:22px;padding:0;display:grid;place-items:center}
.thumb-sizes .btn svg{display:block}
/* Warna aksen aktif: ikon yang sedang dipilih harus JELAS berbeda (bug.txt P4.15). */
.thumb-sizes .btn{color:var(--muted)}
.thumb-sizes .btn.on{border-color:var(--brand);background:rgba(114,232,255,.18);color:var(--brand)}
.lib-actions{display:flex;gap:6px;align-items:center;margin-bottom:8px;flex:0 0 auto;flex-wrap:nowrap}

.inp{width:100%;background:rgba(3,7,18,.7);border:1px solid var(--line);border-radius:11px;padding:8px 10px;outline:0;font-size:12.5px}
.inp:focus{border-color:var(--brand)}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
 background-position:calc(100% - 15px) 51%,calc(100% - 10px) 51%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:26px}

/* Resizer handle */
.resizer{width:6px;cursor:col-resize;background:transparent;transition:background .2s;border-radius:4px;user-select:none}
.resizer:hover,.resizer.dragging{background:var(--brand)}

/* ---------- LIBRARY: layout FIXED, scroll hanya di dalam kategori ----------
   bug.txt P2.7: scroll utama `#libraryScroll` dimatikan total. Panel dibagi dengan
   flexbox: tiap kartu accordion yang TERTUTUP setinggi headernya, yang TERBUKA
   mendapat sisa ruang dan isinya (grid/daftar) yang menggulir sendiri. Dengan begitu
   menggulir Frame tidak pernah menggeser seksi lain dan Theme tidak terdorong keluar
   layar (dua keluhan user 2026-09-01).
   `overscroll-behavior:contain` mencegah roda mouse menular ke panel induk. */
#libraryScroll{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:6px}
#libraryScroll>.acc{margin-bottom:0;flex:0 0 auto;display:flex;flex-direction:column;min-height:0}
#libraryScroll>.acc.on{flex:1 1 auto;min-height:120px}
#libraryScroll>.acc>.acc-h{flex:0 0 auto}
/* `min-height:0` pada BODY kartu terbuka WAJIB: tanpa itu tinggi minimum flex-item
   default (auto = setinggi isi) membuat kartu memanjang mengikuti 21 kartu frame,
   grid ikut setinggi isinya, dan tidak ada yang menggulir — panel malah terpotong.
   Ini bug yang membuat scroll internal tidak pernah aktif. */
#libraryScroll>.acc.on>.acc-b{flex:1 1 auto;min-height:0;overflow:hidden}
#libraryScroll .acc-b>.cards,
#libraryScroll .acc-b>.flist{flex:1 1 auto;min-height:0;
 overscroll-behavior:contain;overflow-y:auto;overflow-x:hidden;padding-right:3px}

/* ---------- frame + theme cards ----------
   bug.txt P1.4 + P2.9: lebar DAN tinggi kartu TETAP dalam px, bukan `1fr` dan bukan
   `aspect-ratio`. Melebarkan panel menambah JUMLAH kolom, tidak membesarkan kartu.

   Kenapa px, bukan aspect-ratio: `.card` adalah button, dan Chromium membungkus isi
   tombol dalam kotak anonim yang mengabaikan aspect-ratio anaknya — hasil ukurannya
   96×34 px (gepeng), tepat bug yang dilaporkan user. Tinggi eksplisit menghilangkan
   ketergantungan pada quirk itu.
   `background-size:contain` menjaga rasio GAMBAR di dalam kotak: tidak pernah
   diregangkan maupun dipotong. */
.cards{display:grid;grid-template-columns:repeat(auto-fill,var(--thumb-w,96px));
 gap:6px;align-content:start;justify-content:start}
.cards.thumb-small{--thumb-w:68px;--thumb-h:121px;gap:5px}
.cards.thumb-norm{--thumb-w:96px;--thumb-h:171px}

/* Tinggi kartu diberikan EKSPLISIT, tidak diturunkan dari isinya. Alasannya diukur,
   bukan dugaan: `.card` adalah button, dan Chromium membungkus isi tombol dalam
   kotak anonim yang tidak menyumbang tinggi ke grid — hasil pengukuran kartu 29px
   padahal `scrollHeight` isinya 171px. Akibatnya dua bug sekaligus: kartu gepeng
   (P1.4) dan grid tidak pernah cukup tinggi untuk memunculkan scroll internal (P2.7).
   Dengan tinggi eksplisit, ukuran kartu tidak lagi bergantung pada quirk itu. */
.card{position:relative;display:block;height:var(--thumb-h,171px);
 border:1px solid var(--line);background:var(--panel);border-radius:10px;overflow:hidden;
 transition:.15s;text-align:left;width:100%;padding:0;cursor:pointer}
.card:hover{border-color:var(--line2);background:rgba(255,255,255,.085)}
.card.on{border-color:var(--brand);box-shadow:0 0 0 1.5px var(--brand) inset}

/* Thumbnail mengisi kartu; `contain` menjaga rasio GAMBAR (tidak diregangkan/dipotong). */
.card .th{position:absolute;inset:0;display:block;
 background:#0F172A center/contain no-repeat}

.card .center-overlay{position:absolute;inset:0;background:rgba(7,11,20,.65);display:flex;flex-direction:column;justify-content:center;align-items:center;padding:6px;text-align:center;transition:background .15s}
.card:hover .center-overlay{background:rgba(7,11,20,.40)}
.card.on .center-overlay{background:rgba(12,28,48,.55)}

.card .center-overlay b{display:block;font-size:11px;font-weight:800;color:#FFFFFF;text-shadow:0 2px 4px rgba(0,0,0,.9);line-height:1.2;margin-bottom:2px;word-break:break-word}
.cards.thumb-small .card .center-overlay b{font-size:9.5px}

.card .center-overlay small{color:#CBD5E1;font-size:9px;text-shadow:0 1px 3px rgba(0,0,0,.9);line-height:1.1;opacity:.9;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cards.thumb-small .card .center-overlay small{display:none}

/* Tombol hapus item: ikon tempat sampah merah (bug.txt P4.20) */
.card .x{position:absolute;top:4px;right:4px;z-index:4;width:20px;height:20px;border-radius:6px;border:1px solid var(--line2);
 background:rgba(3,7,18,.85);color:var(--bad);font-size:11px;line-height:1;display:grid;place-items:center;opacity:0;transition:.15s}
.card:hover .x{opacity:1}
.card .x:hover{background:#7F1D1D;color:#fff}

.empty{color:var(--muted);font-size:11.5px;padding:12px 6px;text-align:center;line-height:1.5}

/* ---------- middle: toolbar 1 baris ---------- */
.mbar{display:flex;align-items:center;gap:10px;width:100%;flex:0 0 auto;
 background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:5px 8px}
.mbar .mid{flex:1;text-align:center;font-size:11px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mbar .mid.out{color:var(--ok)}
.zoom{display:flex;align-items:center;gap:6px;flex:0 0 auto}
.zoom input[type=range]{width:88px;padding:0;background:transparent;border:0}
.zoom .v{font-size:11px;font-weight:900;color:#C8D8EA;min-width:34px;text-align:right;font-variant-numeric:tabular-nums}
.zb{border:1px solid var(--line);background:var(--panel2);border-radius:8px;width:22px;height:22px;font-weight:900;font-size:13px;
 line-height:1;display:grid;place-items:center;color:#DCEAFF}
.zb:hover{border-color:var(--brand)}

/* ---------- canvas / preview (ZOOM ONLY APPLIES TO #stage) ---------- */
.vp{flex:1;min-height:0;width:100%;display:flex;justify-content:center;align-items:flex-start;overflow:auto;padding:8px 0}
#stage{transform:scale(var(--zoom,1));transform-origin:top center;transition:transform .07s linear;margin:auto}
.rc{position:relative;width:var(--rcw,250px);height:var(--rch,444px);border-radius:20px;
 background:linear-gradient(180deg,#06111F,#101E33);border:1px solid rgba(255,255,255,.2);box-shadow:0 24px 70px rgba(0,0,0,.6)}
.rc.output{overflow:hidden}
.rc.adjust{overflow:visible}
/* Video: `--vx` adalah GESERAN dari tengah (0 = center), sama artinya dengan
   `video.x` di preset dan `video_geometry()` di renderer. translateX(-50%) menaruh
   kotak di tengah, lalu --vx menggesernya. */
.rc .vid{position:absolute;left:50%;top:var(--vy);transform:translateX(-50%) translateX(var(--vx,0px));width:var(--vw);aspect-ratio:var(--vratio);
 border-radius:var(--vr);background:linear-gradient(145deg,#334155,#020617);border:2px solid rgba(255,255,255,.6);
 display:grid;place-items:center;color:#ffffff99;font-weight:900;letter-spacing:.14em;font-size:10px;overflow:hidden;z-index:1}
/* Blur background (item 23). Renderer memakai:
     scale cover 9:16 -> boxblur(radius) -> colorchannelmixer 0.6 (digelapkan)
   Preview meniru urutan yang SAMA sebagai lapisan sendiri di bawah video (z-index 0):
   isi kanvas penuh, di-blur sebesar --blurpx, lalu brightness .6.
   Kalau preview cuma menggelapkan tanpa blur, user melihat hasil render yang berbeda
   dari yang ia atur — itu bug yang pernah dilaporkan (preview != render). */
.rc.blur-bg::before{content:"";position:absolute;inset:0;border-radius:inherit;z-index:0;
 background:linear-gradient(145deg,#334155,#020617);
 filter:blur(var(--blurpx,6px)) brightness(.6);pointer-events:none}
.rc .frameimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:inherit;pointer-events:none;z-index:5}
.rc .safe{position:absolute;left:5%;right:5%;top:4%;bottom:8%;border:1px dashed rgba(250,204,21,.7);border-radius:12px;
 pointer-events:none;z-index:4;display:none}
.rc.adjust .safe.on{display:block}
.rc .cropwin{position:absolute;inset:0;border-radius:20px;box-shadow:0 0 0 2000px rgba(3,7,18,.74);border:2px dashed var(--brand);
 pointer-events:none;z-index:5;display:none}
.rc.adjust .cropwin{display:block}

.rc .tlayer{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;
 pointer-events:none;image-rendering:auto}
.rc .sublayer{z-index:10}
.rc .wmlayer{z-index:11}
.rc .headlayer{z-index:12}
.rc .tlayer:not([src]),.rc .tlayer[src=""]{display:none}
.rc .ic{position:absolute;left:var(--icx,16px);top:var(--icy,84px);width:var(--icsize,64px);
 z-index:8;opacity:var(--icop,1)}
.rc .ic img{display:block;width:100%;border-radius:5px}
.rc .ic.empty{display:none}
/* ---------- inspector ---------- */
.acc{border:1px solid var(--line);border-radius:13px;background:var(--panel);overflow:hidden;margin-bottom:6px}
.acc-h{display:flex;align-items:center;justify-content:space-between;width:100%;padding:9px 11px;font-weight:800;font-size:12.5px}
.acc-h .r{display:flex;align-items:center;gap:8px}
.acc-h .chev{color:var(--muted);font-size:10px;transition:transform .18s}
.acc.on .acc-h .chev{transform:rotate(180deg)}
.acc-b{display:none;padding:2px 11px 11px;flex-direction:column;gap:7px}
.acc.on .acc-b{display:flex}
.ctl{display:grid;grid-template-columns:1fr 74px;gap:8px;align-items:center}
.ctl.full{grid-template-columns:1fr}
.ctl label{font-size:12px;color:#C8D8EA;font-weight:700}
.ctl input[type=range]{padding:0;background:transparent;border:0;width:100%}
.ctl .num{font-size:11px;font-weight:900;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.sw{position:relative;width:34px;height:19px;border-radius:99px;background:rgba(255,255,255,.14);border:1px solid var(--line);flex:0 0 auto}
.sw:after{content:"";position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;background:#9FB4CC;transition:.16s}
.sw.on{background:rgba(114,232,255,.32);border-color:var(--brand)}
.sw.on:after{left:17px;background:var(--brand)}
.hint{font-size:11px;color:var(--muted);line-height:1.5}
.strokeWrap{display:flex;flex-direction:column;gap:2px}
.strokeEnds{display:flex;justify-content:space-between;font-size:9.5px;font-weight:800;
 letter-spacing:.04em;color:#61748C;text-transform:uppercase;padding:0 1px}
.hint code{background:rgba(255,255,255,.08);padding:1px 4px;border-radius:4px;font-size:10.5px}

/* color picker block (Hue & Lightness slider DIBUANG — item 22) */
.cp{display:flex;flex-direction:column;gap:6px}
.cp .sw5{display:flex;gap:6px;align-items:center}
.dot{width:22px;height:22px;border-radius:50%;border:2px solid rgba(255,255,255,.75);flex:0 0 auto;transition:.14s}
.dot:hover{transform:scale(1.12)}
.dot.on{box-shadow:0 0 0 2px var(--brand)}
.cp .native{width:30px;height:22px;border:1px solid var(--line);border-radius:6px;background:transparent;padding:0;flex:0 0 auto}
.cval{font-family:ui-monospace,Consolas,monospace;font-size:10.5px;color:var(--muted);letter-spacing:.04em}

/* divider — garis pemisah 2 kelompok dalam satu seksi (item 22) */
.divider{height:1px;background:var(--line);margin:4px 0}

/* peringatan di dalam panel Style. BUKAN `.hint`: seluruh teks keterangan kecil dibuang
   di item 22, tapi peringatan "warna shadow == outline" harus tetap terlihat karena ia
   menandakan setelan yang membuat efek 3D hilang. Warnanya dibedakan supaya jelas ini
   peringatan, bukan keterangan biasa. */
.warnline{font-size:10.5px;line-height:1.35;color:#FCA5A5;background:rgba(220,38,38,.12);
 border:1px solid rgba(220,38,38,.35);border-radius:8px;padding:5px 7px;margin:2px 0}

/* slider X/Y side-by-side (item 22) */
.ctl-xy{display:flex;align-items:center;gap:6px;margin-bottom:2px}
.ctl-xy .xy-label{font-size:11px;font-weight:800;color:var(--muted);flex:0 0 16px;text-align:center}
.ctl-xy input[type=range]{flex:1;padding:0;background:transparent;border:0;min-width:0}
.ctl-xy .xy-num{width:52px;flex:0 0 52px;font-size:11px;font-weight:800;color:#C8D8EA;text-align:center;
 background:rgba(3,7,18,.7);border:1px solid var(--line);border-radius:7px;padding:3px 4px;
 font-variant-numeric:tabular-nums;-moz-appearance:textfield}
.ctl-xy .xy-num::-webkit-inner-spin-button,.ctl-xy .xy-num::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}

/* thumbnail gambar Intro Cover (item 12). Rasio 9:16 supaya user langsung melihat
   bagian mana dari gambarnya yang benar-benar terpakai (render memakai cover-crop). */
.introthumb{width:64px;aspect-ratio:9/16;border-radius:8px;border:1px solid var(--line);
 background-size:cover;background-position:center;margin:2px 0}

/* font rows. CATATAN: TANPA max-height di sini — tinggi dan scroll-nya diatur oleh
   aturan `#libraryScroll .acc-b>.flist` di p2.css (layout Library fixed per-seksi).
   max-height tetap di sini akan mengunci daftar font di 190px dan membuat sisa ruang
   panel kosong saat kartu Font dibuka. */
.flist{display:flex;flex-direction:column;gap:5px}
.frow{display:flex;align-items:center;gap:7px;padding:6px 8px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.frow .n{flex:1;min-width:0;font-size:12.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.frow .kb{font-size:10px;color:var(--muted);font-weight:700}
.frow .lock{font-size:9.5px;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:1px 5px;font-weight:800}
.frow .x{border:1px solid var(--line);background:var(--panel2);border-radius:7px;width:22px;height:22px;color:var(--bad);
 line-height:1;display:grid;place-items:center;flex:0 0 auto;font-size:11px}
.frow .x:hover{background:#7F1D1D;color:#fff}

/* toast + modal */
.toast{position:fixed;right:16px;bottom:14px;background:#0A1526;border:1px solid var(--line2);box-shadow:0 16px 44px rgba(0,0,0,.5);
 padding:10px 14px;border-radius:12px;font-size:12.5px;font-weight:700;display:none;z-index:50;max-width:340px}
.toast.on{display:block;animation:sf .18s ease}
@media(max-width:1150px){.grid{grid-template-columns:200px 1fr 290px}}
@media(max-width:980px){.grid{grid-template-columns:1fr;overflow-y:auto}.col{max-height:none}}
</style>
<script src="qrc:///qtwebchannel/qwebchannel.js"></script>

<body>
  <div class="wrap">

    <!-- top action bar -->
    <div class="bar">
      <div class="grow"></div>
      <!-- Status bar teks: autosave draf sudah dibuang (Item 25), jadi elemen ini
           SENGAJA dibiarkan kosong. Jangan menulis "Menyimpan draf..." ke sini lagi. -->
      <span class="hint" id="applyState"></span>
      <button class="btn sm" id="bRandom" onclick="randomStyle()">🎲 <span data-i18n="random">Random</span></button>
      <button class="btn pri" id="bSaveTheme" onclick="saveTheme()">💾 <span data-i18n="saveTheme">Simpan theme</span></button>
    </div>

    <div class="grid">

      <!-- LEFT: Library sidebar (Urutan Baku: Frame -> Font -> Sticker -> Theme) -->
      <aside class="col" id="colLeft">
        <div class="chead">
          <span class="t" data-i18n="library">Library</span>
          <span class="tslabel" data-i18n="thumbSize">Thumbnail Size</span>
          <div class="thumb-sizes">
            <button class="btn sm ico" id="bThumbSmall" onclick="setThumbSize('small')"
                    data-i18n-title="thumbSmall" title="Kecil">

function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function hex(c){c=(c||'').trim();if(!c)return '#FFFFFF';
 if(c[0]==='#')return (c.length===4?('#'+c[1]+c[1]+c[2]+c[2]+c[3]+c[3]):c).toUpperCase();
 const m=c.match(/rgba?\((\d+)[,\s]+(\d+)[,\s]+(\d+)/i);
 return m?('#'+[1,2,3].map(i=>(+m[i]).toString(16).padStart(2,'0')).join('').toUpperCase()):'#FFFFFF'}
function hsl2hex(h,s,l){s/=100;l/=100;
 const k=n=>(n+h/30)%12,a=s*Math.min(l,1-l),f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));
 return '#'+[f(0),f(8),f(4)].map(x=>Math.round(255*x).toString(16).padStart(2,'0')).join('').toUpperCase()}
function hex2hsl(H){const h=hex(H);const r=parseInt(h.slice(1,3),16)/255,g=parseInt(h.slice(3,5),16)/255,b=parseInt(h.slice(5,7),16)/255;
 const mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn;let hu=0;
 if(d){if(mx===r)hu=((g-b)/d)%6;else if(mx===g)hu=(b-r)/d+2;else hu=(r-g)/d+4;hu*=60;if(hu<0)hu+=360}
 const l=(mx+mn)/2,s=d?d/(1-Math.abs(2*l-1)):0;
 return{h:Math.round(hu),s:Math.round(s*100),l:Math.round(l*100)}}
function lum(H){const h=hex(H);const c=[1,3,5].map(i=>parseInt(h.substr(i,2),16)/255);
 return .2126*c[0]+.7152*c[1]+.0722*c[2]}

function computeRC(){
 const r=CW/CH;
 if(r>=RC_MAX_W/RC_MAX_H){RCW=RC_MAX_W;RCH=Math.round(RC_MAX_W/r)}
 else{RCH=RC_MAX_H;RCW=Math.round(RC_MAX_H*r)}

}
function setCanvasSize(id){
 const c=_canvases.find(x=>x.id===id); if(!c)return;
 const ow=CW,oh=CH; CW=c.w; CH=c.h; S.canvasId=id;
 const sx=CW/ow, sy=CH/oh, ss=Math.min(sx,sy), R=Math.round;
 // skalakan semua koordinat supaya tidak keluar frame saat rasio berubah
 S.video.y=R(S.video.y*sy); S.video.x=R((+S.video.x||0)*sx);
 S.video.radius=R(S.video.radius*ss);
 ['sub','head','wm'].forEach(k=>{const b=S[k];
  if('x' in b)b.x=R(b.x*sx); if('y' in b)b.y=R(b.y*sy);
  b.size=R(b.size*ss); b.outline=R(b.outline*ss);

  // menulis b.shadow=NaN untuk head/wm yang tidak punya field itu.
  if('shadowX' in b)b.shadowX=R(b.shadowX*ss);

  if('shadowBlur' in b)b.shadowBlur=R(b.shadowBlur*ss)});

function V(k,v){document.documentElement.style.setProperty(k,v)}

/* Geometri video efektif. Sejak 2026-08-30 preview TIDAK lagi meniru
   cover_frame_window(): pemaksaan itu dibuang dari renderer juga, karena ia menimpa
   nilai skala pilihan user (bug yang dilaporkan user: slider terasa tidak berpengaruh).
   Latar tetap tidak bocor hitam karena base kanvas = video yang di-cover penuh. */
function effGeom(){
 const v=S.video;
 let r=16/9; try{const p=String(v.aspect).split('/');r=(+p[0])/(+p[1])}catch(e){}
 const w=Math.round(CW*v.scale);
 return {w:w,h:Math.round(w/r),y:Math.round(v.y),x:Math.round(+v.x||0)};
}

/* ====== SKALA VIDEO: 0% = utuh (tanpa terpotong), 300% = penuh kanvas ======
   Preset tetap menyimpan `video.scale` ABSOLUT (fraksi lebar kanvas) supaya renderer
   tidak perlu tahu apa pun soal slider — itu yang menjamin preview == render. Slider
   hanya lapisan tampilan di atas nilai itu.
     z=0   -> scale 1.0  : lebar video = lebar kanvas, seluruh frame video terlihat
     z=300 -> scale cover: tinggi video = tinggi kanvas, kanvas terisi penuh */
function coverScale(){
 let r=16/9; try{const p=String(S.video.aspect).split('/');r=(+p[0])/(+p[1])}catch(e){}
 return Math.max(1.0001,(CH*r)/CW);
}
function zoomToScale(z){const c=coverScale();
 return 1+(c-1)*(Math.max(0,Math.min(300,+z||0))/300)}
function scaleToZoom(s){const c=coverScale();
 return Math.round(Math.max(0,Math.min(300,((+s||1)-1)/(c-1)*300)))}

 const z=num(el&&el.value!==undefined?el.value:el,0);
 S.video.scale=+zoomToScale(z).toFixed(4);
 const box=el&&el.closest?el.closest('.ctl'):null;
 const n=box?box.querySelector('.num'):null;
 if(n)n.textContent=Math.round(z)+'%';
 syncAll()}

function syncAll(){

 V('--blurpx',(Math.max(0,+v.blur||0)/SX).toFixed(2)+'px');

 V('--icop',(+S.png.opacity).toFixed(3));

function textLayerSpec(){

function doTextLayers(){

 if(spec===_tlLast&&!_tlPending)return;
 if(_tlBusy){_tlPending=true;return}
 _tlBusy=true; _tlLast=spec;
 B.render_text_layers(spec,js=>{

/* warna heksadesimal sternary: pastikan format #RRGGBB */
function hex(c){
 const s=String(c||'').trim();
 if(!s)return '#000000';
 if(s[0]!=='#')return s;
 if(s.length===4)return '#'+s[1]+s[1]+s[2]+s[2]+s[3]+s[3];
 return s.length>=7?s:'#000000';
}
/* warna stroke otomatis: hitam kalau warna terang, putih kalau gelap */
function autoStroke(hexColor){
 const c=hex(hexColor);
 if(c.length<7)return '#000000';
 const r=parseInt(c.slice(1,3),16),g=parseInt(c.slice(3,5),16),b=parseInt(c.slice(5,7),16);
 const lum=(r*0.299+g*0.587+b*0.114)/255;
 return lum>0.6?'#000000':'#FFFFFF';
}

/* ====== ZERO-CENTER SLIDER X & Y (bug.txt P2.10) ======
   Aturan yang diminta user: titik TENGAH slider = posisi NETRAL (Center) di kanvas,
   seragam untuk Video, Headline, Subtitle, Creator, dan Sticker.

   Cara kerjanya: preset TETAP menyimpan koordinat ABSOLUT (renderer tidak perlu tahu
   apa pun soal slider — itu yang menjaga preview == render). Slider hanya menampilkan
   SELISIH terhadap posisi tengah. Karena itu tengah harus dihitung, dan untuk teks
   tingginya baru diketahui SETELAH auto-fit memilih ukuran font — angkanya datang dari
   `_ink` (kotak tinta yang dilaporkan mesin render), bukan ditebak di JS.

   Kenapa selisih, bukan menyimpan offset di preset: kalau UI menulis offset dan
   renderer menambahkan tengah sendiri, setiap perubahan ukuran font akan MENGGESER
   teks yang sudah pas. Dengan model selisih, `y` absolut tetap diam; yang berubah
   hanya angka yang ditampilkan. */
function inkOf(key){return _ink[key]||null}
function pngAspect(){
 // Tinggi stiker = lebar × rasio gambar asli. Diambil dari <img> yang sudah dimuat;
 // kalau belum ada gambar, anggap 1:1 (tidak ada info lain yang jujur).
 const img=document.querySelector('.rc .ic img');
 if(img&&img.naturalWidth&&img.naturalHeight)return img.naturalHeight/img.naturalWidth;
 return 1;
}
/* Untuk TEKS, `y` preset adalah baris awal gambar, BUKAN tepi atas huruf: font punya
   ascender/leading di atasnya. Mesin melaporkan `dy_top` (jarak tepi tinta dari `y`)
   dan `dcx` (simpangan pusat tinta dari tengah kanvas setelah geseran x), jadi posisi
   tengah bisa dihitung tepat tanpa coba-coba. */
function centerYFor(key){
 if(key==='video'){const g=effGeom();return Math.round((CH-g.h)/2)}
 if(key==='png')return Math.round((CH-S.png.w*pngAspect())/2);
 const b=inkOf(key);
 if(!b||!b.h)return Math.round(CH/2);   // lapisan pertama belum digambar
 return Math.round((CH-b.h)/2)-Math.round(b.dy_top||0);
}
function centerXFor(key){
 if(key==='video')return 0;                                  // 0 = tepat di tengah
 if(key==='png')return Math.round((CW-S.png.w)/2);
 const b=inkOf(key);
 // teks: x = baseX() berarti nudge 0 (mengikuti align). `dcx` mengoreksi sisa
 // pembulatan/asimetri glyph supaya pusat tinta benar-benar di tengah kanvas.
 return baseX()-Math.round((b&&b.dcx)||0);
}
function offY(key){return Math.round((num(S[key].y,0))-centerYFor(key))}
function offX(key){
 const cur=(key==='video')?num(S.video.x,0):num(S[key].x,centerXFor(key));
 return Math.round(cur-centerXFor(key));
}
function setOffY(key,el){
 const v=num(el&&el.value!==undefined?el.value:el,0);
 S[key].y=centerYFor(key)+Math.round(v);
 showNum(el,Math.round(v));
 syncAll()}
function setOffX(key,el){
 const v=num(el&&el.value!==undefined?el.value:el,0);
 S[key].x=centerXFor(key)+Math.round(v);
 showNum(el,Math.round(v));
 syncAll()}

/* Geser X = NUDGE dari posisi hasil perataan, bukan koordinat absolut.

    autoStroke(b.color)+'"></span><span class="cval">'+autoStroke(b.color)+'</span></div></div>'
   :colorBlock(key,'outlineColor',b.outlineColor))}
function setOutlineAuto(k){S[k].outlineColor='';syncAll();buildInspector()}
function setOutlineCustom(k){if(!S[k].outlineColor)S[k].outlineColor=autoStroke(S[k].color);syncAll();buildInspector()}

/* outline: slider bipolar. Tengah (0) = tanpa stroke.
   Ke KANAN = inner (mengikis ke dalam), ke KIRI = outer (melebar ke luar).
   State disimpan sebagai `outline` (ketebalan >=0) + `outlineMode` ('outer'|'inner');
   nilai slider = +tebal untuk inner, -tebal untuk outer. */
function strokeSliderVal(b){return (b.outlineMode==='inner'?1:-1)*Math.abs(b.outline||0)}
function setStroke(key,el){
 const v=Math.round(num(el&&el.value!==undefined?el.value:el,0));
 const b=S[key];
 b.outline=Math.abs(v);
 if(v>0)b.outlineMode='inner'; else if(v<0)b.outlineMode='outer';
 syncAll();
 const box=el&&el.closest?el.closest('.strokeWrap'):null;
 const n=box?box.querySelector('.num'):null;
 if(n)n.textContent=strokeLabel(b);
}
function strokeLabel(b){
 const w=Math.abs(b.outline||0);
 if(!w)return L('strokeOff');
 return (b.outlineMode==='inner'?'IN ':'OUT ')+w}
function strokeBlock(key){
 const b=S[key],v=strokeSliderVal(b);
 return '<div class="strokeWrap">'+
  '<div class="ctl"><label>'+L('outline')+'</label><span class="num">'+strokeLabel(b)+'</span>'+
  '<input style="grid-column:1/-1" type="range" min="-20" max="20" step="1" value="'+v+
  '" oninput="'+esc('setStroke(\''+key+'\',this)')+'"></div>'+
  '<div class="strokeEnds"><span>← '+L('outer')+'</span><span>'+L('off')+'</span><span>'+L('inner')+' →</span></div>'+
  '</div>'}

function set(path,v){const p=path.split('.');let o=S;for(let i=0;i<p.length-1;i++)o=o[p[i]];
 o[p[p.length-1]]=v;syncAll()}

/* ====== KERAPATAN SUBTITLE (1 / 3 / 5 kata) ======
   Dibakukan di theme (permintaan user 2026-08-30): SRT selalu ditulis 1 kata per entri
   oleh Stage 4, lalu theme yang menentukan tampilannya — jadi tidak perlu lagi opsi
   subtitle di tab Run, dan mengubahnya TIDAK butuh menjalankan Stage 4 ulang.

   Teks contoh dibuat otomatis sebanyak N kata supaya kerapatannya KELIHATAN di preview
   ("SUBTITLE" vs "SUBTITLE SUBTITLE SUBTITLE"). Begitu user mengetik teksnya sendiri,
   contoh otomatis berhenti menimpanya — kalau tidak, ketikan user akan hilang setiap
   pilihan kata diubah. */
function sampleSubText(n){
 return new Array(Math.max(1,+n||1)).fill('SUBTITLE').join(' ')}
function setWpl(v){
 S.sub.wpl=Math.max(1,+v||1);
 if(S.sub.autoText!==false)S.sub.text=sampleSubText(S.sub.wpl);
 syncAll();buildInspector()}
function setSubText(v){
 S.sub.text=v;
 // Kosong = kembali ke contoh otomatis; ada isi = milik user, jangan ditimpa.
 S.sub.autoText=!String(v||'').trim();
 if(S.sub.autoText)S.sub.text=sampleSubText(S.sub.wpl);
 syncAll()}
/* el = elemen input (dikirim sebagai `this`), bukan window.event — lebih andal. */
function setN(path,el){const v=num(el&&el.value!==undefined?el.value:el,0);
 set(path,v);
 const box=el&&el.closest?el.closest('.ctl'):null;
 const n=box?box.querySelector('.num'):null;
 if(n)n.textContent=Math.round(v)}
/* Sama dengan setN tapi TIDAK dibulatkan ke integer: untuk nilai pecahan seperti
   durasi intro (0.4s) yang kalau dibulatkan akan berubah jadi 0 atau 1. */
function setNf(path,el){const v=num(el&&el.value!==undefined?el.value:el,0);
 set(path,v);
 const box=el&&el.closest?el.closest('.ctl'):null;
 const n=box?box.querySelector('.num'):null;
 if(n)n.textContent=v.toFixed(2)+'s'}
function setNr(path,el,div){const raw=num(el&&el.value!==undefined?el.value:el,0);
 set(path,raw/(div||1));
 const box=el&&el.closest?el.closest('.ctl'):null;
 const n=box?box.querySelector('.num'):null;
 if(n)n.textContent=raw+'%'}
function toggleB(path){const p=path.split('.');let o=S;for(let i=0;i<p.length-1;i++)o=o[p[i]];
 const k=p[p.length-1];o[k]=!o[k];syncAll();buildInspector()}

function fontOpts(){return _fonts.length?_fonts.map(f=>[f.file,f.family+(f.protected?' ('+L('builtin')+')':'')]):[['','—']]}

function buildInspector(){
 const box=$('inspector'); if(!box)return;

 h+=sec('video','',L('secVideo'),

   slider(L('scale'),scaleToZoom(S.video.scale),0,300,1,'setVideoZoom(this)','%')+

 // 3. Headline (item 22: hapus textBox, hapus label Font, hapus hint, tambah divider)
 const hd=S.head;
 h+=sec('head','',L('secHead'),
   selectBox('',fontOpts(),hd.font,'set("head.font",this.value);buildInspector()')+
   slider(L('size'),hd.size,20,240,1,'setN("head.size",this)')+
   slider(L('maxLines'),hd.maxLines,1,4,1,'setN("head.maxLines",this)')+
   sliderXY('head')+
   alignBlock('head')+
   slider(L('lineGap'),Math.round(hd.lineSpacing*100),-55,60,1,'setNr("head.lineSpacing",this,100)')+

   '<div class="ctl full"><label>'+L('color')+'</label></div>'+colorBlock('head','color',hd.color)+
   strokeBlock('head')+
   outlineBlock('head')+
   shadowBlock('head'),
   sw(hd.on,'toggleB("head.on")'));

 // 4. Subtitle (item 22: hapus textBox manual, hapus label Font, hapus hints, tambah divider)
 const s=S.sub;
 h+=sec('sub','',L('secSub'),
   selectBox('',fontOpts(),s.font,'set("sub.font",this.value);buildInspector()')+
   slider(L('size'),s.size,20,240,1,'setN("sub.size",this)')+
   slider(L('maxLines'),s.maxLines,1,4,1,'setN("sub.maxLines",this)')+
   sliderXY('sub')+
   alignBlock('sub')+
   slider(L('lineGap'),Math.round(s.lineSpacing*100),-55,60,1,'setNr("sub.lineSpacing",this,100)')+
   '<div class="divider"></div>'+
   '<div class="ctl full"><label>'+L('color')+'</label></div>'+colorBlock('sub','color',s.color)+
   strokeBlock('sub')+
   outlineBlock('sub')+
   shadowBlock('sub')+
   selectBox(L('animation'),[['none',L('none')],['pop',L('pop')],['fade',L('fade')],['up',L('up')],
     ['word',L('wordAnim')],['karaoke',L('karaoke')]],s.anim,'set("sub.anim",this.value);buildInspector()')+
   ((s.anim==='word'||s.anim==='karaoke')?
     ('<div class="ctl full"><label>'+L('activeColor')+'</label></div>'+
      colorBlock('sub','active',s.active)):'')+
   selectBox(L('wordsPerLine'),[[1,L('wpl1')],[3,L('wpl3')],[5,L('wpl5')]],
     (S.sub.wpl||3),'setWpl(this.value)'));

 // 5. Creator (Watermark) — DIKEMBALIKAN (permintaan user 2026-09-01): kartu ini yang
 //    dipakai untuk mengatur TATA LETAK teks "Creator!" di kanvas. Sebelumnya ia sempat
 //    dibuang karena salah tulis di bug.txt.
 //    Bentuknya mengikuti aturan item 22 yang sama dengan Headline & Subtitle:
 //    label "Font" dan "Align" dihilangkan, tanpa .hint, dan satu divider memisahkan
 //    [Font, Size, X/Y, Align] dari [Warna, Outline, Shadow].
 //    Kotak teks manual TIDAK dipasang: teks watermark memakai penanda otomatis
 //    (WM_AUTO_TOKENS) yang saat render diganti nama kreator video.
 const w=S.wm;
 h+=sec('wm','',L('secWm'),
   selectBox('',fontOpts(),w.font,'set("wm.font",this.value);buildInspector()')+
   slider(L('size'),w.size,20,240,1,'setN("wm.size",this)')+

 // 6. Sticker (item 22: reorder Size->X/Y->divider->Opacity->Shadow)
 h+=sec('png','',L('secPng'),
   slider(L('size'),S.png.w,40,900,1,'setN("png.w",this)')+

 // 7. Intro Cover (item 12) — lapisan penutup di detik-detik AWAL video.
 //    Video & audio utama TETAP jalan dari detik 0 di latar; cover hanya menutupi
 //    layar lalu fade out. Gunanya: frame pertama itulah yang dipakai TikTok/Shorts
 //    sebagai thumbnail feed.
 //    Kontrol hanya muncul saat sakelarnya ON supaya panel tidak penuh saat tidak dipakai.
 h+=sec('intro','',L('secIntro'),
   (S.intro.on?(
     slider(L('introDur'),(+S.intro.dur||0.4).toFixed(2),0.1,2,0.05,'setNf("intro.dur",this)','s')+
     slider(L('introFade'),(+S.intro.fade||0).toFixed(2),0,1,0.05,'setNf("intro.fade",this)','s')+
     '<div class="divider"></div>'+
     '<div class="ctl full"><label>'+L('introBg')+'</label>'+
     '<div class="row"><button class="btn sm" onclick="importIntroBg()">＋ '+L('import')+'</button>'+
     (S.intro.bg?('<button class="btn sm" onclick="clearIntroBg()" data-i18n-title="trash" title="'+esc(L('trash'))+'">'+ICON_TRASH+'</button>'):'')+
     '</div></div>'+
     (S.intro.bgUrl?('<div class="introthumb" style="background-image:url('+S.intro.bgUrl+')"></div>'):'')+

     '<div class="ctl"><label>'+L('introWm')+'</label>'+sw(S.intro.wm,'toggleB("intro.wm")')+'</div>'
   ):''),
   sw(S.intro.on,'toggleB("intro.on")'));

 // 8. Export Option (item 22: hapus hint)
 h+=sec('export','',L('secExport'),
   slider(L('quality'),S.exp.crf,14,30,1,'setN("exp.crf",this)')+
   selectBox(L('speed'),[['veryfast','veryfast'],['fast','fast'],['medium','medium'],['slow','slow']],
     S.exp.preset,'set("exp.preset",this.value)'));

 box.innerHTML=h;
 refreshWmPlaceholder();

/* Pusatkan / reset kotak video. `centerV` memakai perhitungan tengah yang SAMA dengan
   slider zero-center supaya tombol dan slider tidak pernah berbeda pendapat. */
function centerV(){
 S.video.x=0;
 S.video.y=centerYFor('video');
 syncAll();buildInspector()}
function resetV(){
 S.video.scale=1.0;S.video.x=0;S.video.radius=0;
 S.video.y=centerYFor('video');

/* ============ IMAGE LAYERS (FRAME & OVERLAY) ============ */
/* Bridge `list_frames()` mengirim `frame_url` (file:// ke frame.png) dan
   `thumbnail_url`. TIDAK ADA field bernama `url` — memakai `f.url` menghasilkan
   undefined, `setFrameImg(undefined)` menyembunyikan lapisan, dan frame yang diklik
   di Library tidak pernah muncul di preview tengah (bug P1.1 di bug.txt).
   Semua pembacaan URL frame WAJIB lewat helper ini. */
function frameUrl(f){
 if(!f)return '';
 return f.frame_url||f.url||'';
}

function setFrameImg(url){
 document.querySelectorAll('.rc').forEach(rc=>{
  let img=rc.querySelector('.frameimg');
  if(url){
   if(!img){
    img=document.createElement('img');
    img.className='frameimg';
    rc.appendChild(img);
   }
   if(img.getAttribute('src')!==url)img.setAttribute('src',url);
   img.style.display='';
  } else if(img){
   img.style.display='none';
   img.removeAttribute('src');
  }
 });
}

function setOverlayImg(url){
 document.querySelectorAll('.rc .ic').forEach(ic=>{
  let img=ic.querySelector('img');
  if(url){
   if(!img){
    img=document.createElement('img');
    ic.appendChild(img);
   }
   if(img.getAttribute('src')!==url)img.setAttribute('src',url);
   ic.classList.remove('empty');
  } else {
   if(img)img.remove();
   ic.classList.add('empty');
  }
 });
}

function buildPreset(){
 return {
  canvas:{w:CW,h:CH,id:S.canvasId},
  frame:{id:S.frame||'',path:''},
  video:{scale:+S.video.scale.toFixed(4),x:Math.round(+S.video.x||0),y:Math.round(S.video.y),
         radius:Math.round(S.video.radius),aspect:S.video.aspect,
         blur_background:!!S.video.blurOn, blur_radius:Math.round(+S.video.blur||40)},
  subtitle:{font:S.sub.font,size:Math.round(S.sub.size),y:Math.round(S.sub.y),
   align:S.sub.align||'center',max_lines:Math.max(1,S.sub.maxLines|0),
   line_spacing:+(+S.sub.lineSpacing||-0.15).toFixed(3),
   outline:Math.round(Math.abs(S.sub.outline)),outline_mode:S.sub.outlineMode||'outer',
   outline_color:S.sub.outlineColor||'',
   shadow_enabled:!!S.sub.shadowOn,
   shadow_x:Math.round(S.sub.shadowX),shadow_y:Math.round(S.sub.shadowY),
   shadow_color:hex(S.sub.shadowColor),shadow_blur:Math.round(S.sub.shadowBlur),
   layer_order:S.sub.layerOrder||'shadow-stroke-fill',
   color:hex(S.sub.color),active_color:hex(S.sub.active),
   animation:S.sub.anim,words_per_line:Math.max(1,S.sub.wpl|0)},
  headline:{enabled:!!S.head.on,text:S.head.text,gemini_default:false,font:S.head.font,
   size:Math.round(S.head.size),x:Math.round(S.head.x),y:Math.round(S.head.y),
   max_lines:Math.max(1,S.head.maxLines|0),align:S.head.align||'center',
   line_spacing:+(+S.head.lineSpacing||-0.25).toFixed(3),
   outline:Math.round(Math.abs(S.head.outline)),outline_mode:S.head.outlineMode||'outer',
   outline_color:S.head.outlineColor||'',
   shadow_enabled:!!S.head.shadowOn,
   shadow_x:Math.round(S.head.shadowX),shadow_y:Math.round(S.head.shadowY),
   shadow_color:hex(S.head.shadowColor),shadow_blur:Math.round(S.head.shadowBlur),
   layer_order:S.head.layerOrder||'shadow-stroke-fill',
   color:hex(S.head.color)},
  watermark:{enabled:!!S.wm.on,text:S.wm.text,font:S.wm.font,size:Math.round(S.wm.size),
   x:Math.round(S.wm.x),y:Math.round(S.wm.y),max_lines:1,align:S.wm.align||'center',
   outline:Math.round(Math.abs(S.wm.outline)),outline_mode:S.wm.outlineMode||'outer',
   outline_color:S.wm.outlineColor||'',
   shadow_enabled:!!S.wm.shadowOn,
   shadow_x:Math.round(S.wm.shadowX),shadow_y:Math.round(S.wm.shadowY),
   shadow_color:hex(S.wm.shadowColor),shadow_blur:Math.round(S.wm.shadowBlur),
   layer_order:S.wm.layerOrder||'shadow-stroke-fill',
   color:hex(S.wm.color)},
  custom_png:{enabled:!!S.png.on,path:S.png.path||'',
   x:Math.round(S.png.x),y:Math.round(S.png.y),width:Math.round(S.png.w),
   opacity:+(+S.png.opacity).toFixed(3)},
  intro:{enabled:!!S.intro.on,
   duration:+(+S.intro.dur||0.4).toFixed(2),
   fade:+(+S.intro.fade||0).toFixed(2),
   background:S.intro.bg||'',
   show_headline:!!S.intro.head,
   show_creator:!!S.intro.wm},
  export:{w:CW,h:CH,crf:S.exp.crf|0,preset:S.exp.preset}
 }}

function applyPreset(p){
 if(!p||typeof p!=='object')return;
 const c=p.canvas||{}; CW=+c.w||CW; CH=+c.h||CH;
 S.canvasId=c.id||(_canvases.find(x=>x.w===CW&&x.h===CH)||{}).id||S.canvasId;
 S.frame=(p.frame||{}).id||'';
 const v=p.video||{};
 S.video={scale:+v.scale||1,x:+v.x||0,y:+v.y||0,radius:+v.radius||0,aspect:v.aspect||'16/9',
          blurOn:!!v.blur_background, blur:+v.blur_radius||40};
 const shadowIn=(b,defOff)=>{
  const legacy=(+b.shadow||0);
  return {shadowOn:b.shadow_enabled!==false,
   shadowX:(b.shadow_x===undefined?(legacy||defOff):+b.shadow_x),
   shadowY:(b.shadow_y===undefined?(legacy||defOff):+b.shadow_y),
   shadowColor:b.shadow_color||'#000000',
   shadowBlur:+b.shadow_blur||0,
   layer_order:b.layer_order||'shadow-stroke-fill'}};
 const s=p.subtitle||{};
 S.sub=Object.assign({font:s.font||'subtitle.ttf',size:+s.size||80,y:+s.y||0,
  align:s.align||'center',maxLines:Math.max(1,+s.max_lines||2),
  lineSpacing:(s.line_spacing===undefined?-0.15:
    (Math.abs(+s.line_spacing)<=1?+s.line_spacing:+s.line_spacing/86)),
  outline:+s.outline||0,
  outlineMode:s.outline_mode||'outer',outlineColor:s.outline_color||'',
  color:s.color||'#FFFFFF',active:s.active_color||'#FFA500',
  anim:s.animation||'none',
  wpl:(function(v){v=+v||0; if(v<=0)return 3; if(v<=1)return 1; if(v<=4)return 3; return 5})(s.words_per_line),
  autoText:S.sub.autoText,text:S.sub.text},shadowIn(s,3));
 if(S.sub.autoText!==false)S.sub.text=sampleSubText(S.sub.wpl);
 const h=p.headline||{};
 S.head=Object.assign({on:h.enabled!==false,text:h.text||S.head.text,
  font:h.font||'title.ttf',size:+h.size||86,
  x:+h.x||45,y:+h.y||55,maxLines:Math.max(1,+h.max_lines||2),align:h.align||'center',
  lineSpacing:(h.line_spacing===undefined?-0.25:
    (Math.abs(+h.line_spacing)<=1?+h.line_spacing:+h.line_spacing/86)),
  outline:+h.outline||0,outlineMode:h.outline_mode||'outer',
  outlineColor:h.outline_color||'',color:h.color||'#FFFFFF'},shadowIn(h,8));
 const w=p.watermark||{};
 S.wm=Object.assign({on:w.enabled!==false,text:w.text||S.wm.text,
  font:w.font||'title.ttf',size:+w.size||130,
  x:+w.x||45,y:+w.y||55,align:w.align||'center',outline:+w.outline||0,outlineMode:w.outline_mode||'outer',
  outlineColor:w.outline_color||'',color:w.color||'#D94B0A'},shadowIn(w,6));
 const g=p.custom_png||{};
 S.png={on:!!g.enabled,name:(g.path||'').split('/').pop()||'',path:g.path||'',url:'',
  x:+g.x||0,y:+g.y||0,w:+g.width||220,
  opacity:(g.opacity===undefined||g.opacity===null)?1:Math.max(0,Math.min(1,+g.opacity))};
 if(S.png.path&&B&&B.overlay_url){B.overlay_url(S.png.path,u=>{if(u){S.png.url=u;setOverlayImg(u);renderOverlayList()}
  else{S.png.on=false;S.png.url='';syncAll();buildInspector();toast(L('pngMissing'))}})}
 else setOverlayImg('');
 const e=p.export||{};
 S.exp={crf:(e.crf===undefined?18:+e.crf),preset:e.preset||'medium'};
 // Intro Cover (item 12). Preset lama tanpa blok `intro` -> tetap mati, aman.
 const ic=p.intro||{};
 S.intro={on:!!ic.enabled,
  dur:(ic.duration===undefined?0.4:Math.max(0.05,+ic.duration||0.4)),
  fade:(ic.fade===undefined?0.15:Math.max(0,+ic.fade||0)),
  bg:ic.background||'',bgUrl:'',
  head:ic.show_headline!==false,wm:ic.show_creator!==false};
 // Gambar cover disimpan sebagai path relatif di preset; URL file:// untuk preview
 // diminta ke host, sama caranya dengan stiker overlay.
 if(S.intro.bg&&B&&B.overlay_url){
  B.overlay_url(S.intro.bg,u=>{S.intro.bgUrl=u||''; if(!u)S.intro.bg=''; buildInspector()});
 }
 
 const curF=_frames.find(x=>x.id===S.frame);
 if(curF)setFrameImg(frameUrl(curF));

 computeRC(); syncAll(); buildInspector(); renderFrames(); renderThemes(); renderOverlayList();
}

function loadFrames(){
 if(!(B&&B.list_frames)){renderFrames();return}
 B.list_frames(js=>{let d=[];try{d=JSON.parse(js)}catch(e){}
  if(!Array.isArray(d)){toast(L('failed')+((d&&d.error)||'?'));return}
  _frames=d;
  let cur=null;
  if(S.frame&&_frames.some(x=>x.id===S.frame)){
   cur=_frames.find(x=>x.id===S.frame);
  } else if(_frames[0]){
   S.frame=_frames[0].id;
   cur=_frames[0];
  }
  if(cur)setFrameImg(frameUrl(cur));
  renderFrames();
  syncAll();
 });
}

/* ============ IKON ============
   Tombol hapus item memakai ikon TEMPAT SAMPAH merah, bukan huruf "×" (bug.txt P4.20).
   Satu sumber ikon supaya kartu Frame, Theme, Sticker, dan baris Font tidak pernah
   berbeda bentuk. */
const ICON_TRASH='<svg width="12" height="12" viewBox="0 0 14 14" aria-hidden="true">'+
 '<g fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round">'+
 '<path d="M2.5 4h9"/><path d="M5.6 4V2.6h2.8V4"/>'+
 '<path d="M3.6 4l.6 7.2a.8.8 0 0 0 .8.7h4a.8.8 0 0 0 .8-.7L10.4 4"/>'+
 '<path d="M6 6.3v4"/><path d="M8 6.3v4"/></g></svg>';
/* Elemen SPAN, bukan tombol: kartu Frame/Theme sendiri sudah sebuah tombol, dan
   tombol di dalam tombol adalah HTML tidak sah — parser memecah nesting-nya
   sehingga tombol hapus terlempar keluar kartu. role/tabindex menjaga aksesibilitas.
   (Jangan tulis tag literal di komentar ini: pemeriksa keseimbangan tag di build.py
   ikut menghitungnya dan melaporkan MISMATCH palsu.) */
function trashBtn(onclick,label){
 return '<span class="x" role="button" tabindex="0" data-i18n-title="trash" title="'+esc(label||'')+
  '" aria-label="'+esc(label||'')+'" onclick="'+esc(onclick)+'">'+ICON_TRASH+'</span>';
}

function saveTheme(){
 if(!(B&&B.save_preset_as)){toast(L('guiOnly'));return}
 const def=(_themes.find(t=>t.id===_activeTheme)||{}).name||'';
 const done=js=>{let r={};try{r=JSON.parse(js)}catch(e){}
  if(r.error){toast(L('failed')+r.error);return}

 const go=name=>{if(!name)return;
  B.save_preset_as(JSON.stringify(buildPreset()),name,'',js=>{
   let r={};try{r=JSON.parse(js)}catch(e){}
   if(r.exists){
    const ask=L('askOverwrite').replace('%s',r.exists_name||name);
    const ow=()=>B.overwrite_theme(JSON.stringify(buildPreset()),name,r.exists,done);
    if(B.confirm)B.confirm(ask,ok=>{if(ok)ow();else askName(name)});
    else if(confirm(ask))ow(); else askName(name);
    return}
   done(js)})};
 const askName=def2=>{
  if(B.prompt_text)B.prompt_text(L('themeName'),def2||'',js=>{let r={};try{r=JSON.parse(js)}catch(e){}
    if(r.ok)go((r.text||'').trim())});

/* ============ ACCORDION HANDLER FOR LIBRARY ============
   Panel Library memakai layout FIXED (tanpa scroll induk), jadi kartu yang TERBUKA
   mendapat sisa ruang. Kalau semua kartu ditutup panel jadi kosong dan bingung, dan
   kalau semua dibuka tiap seksi cuma dapat sisa sempit. Karena itu: satu kartu terbuka
   pada satu waktu (accordion sungguhan), sama seperti panel Style di kanan. */
function toggleLibAcc(id){
 const el=$(id);
 if(!el)return;
 const willOpen=!el.classList.contains('on');
 document.querySelectorAll('#libraryScroll > .acc').forEach(a=>a.classList.remove('on'));
 if(willOpen)el.classList.add('on');
}

/* ============ ZOOM GESTURE: ctrl+wheel / pinch -> HANYA kanvas preview ============
   bug.txt P1.5. Kenapa harus di halaman dan bukan cuma di filter Qt: hanya listener
   `wheel` NON-PASSIVE di dalam halaman yang boleh memanggil preventDefault() untuk
   membatalkan zoom bawaan Chromium. Filter Qt (NoZoomFilter) tetap dipertahankan
   sebagai jaring untuk ctrl+plus/minus/0.
   Di dalam area preview: gestur me-zoom preview. Di luar: gestur DIBATALKAN saja
   (tidak nge-zoom apa pun) — bukan dibiarkan nge-zoom seluruh UI. */
function initZoomGesture(){
 if(window.__zoomGesture)return;
 window.__zoomGesture=true;
 const onWheel=e=>{
  if(!e.ctrlKey)return;              // wheel biasa = scroll normal, jangan diganggu
  e.preventDefault();                // apa pun posisinya: JANGAN zoom halaman
  const vp=$('previewViewport');
  if(!vp)return;
  const r=vp.getBoundingClientRect();
  const inPreview=(e.clientX>=r.left&&e.clientX<=r.right&&
                   e.clientY>=r.top&&e.clientY<=r.bottom);
  if(!inPreview)return;              // di luar preview: cukup dibatalkan
  // deltaY < 0 = gulir ke atas / pinch keluar = perbesar
  setZoom(S.zoom+(e.deltaY<0?10:-10));
 };
 // passive:false WAJIB, kalau tidak preventDefault() diabaikan browser.
 window.addEventListener('wheel',onWheel,{passive:false});
 document.addEventListener('wheel',onWheel,{passive:false});
}

/* ============ RESIZER DRAG HANDLER ============ */
function initResizer(){
 const resizer=$('resizerLeft');
 if(!resizer)return;
 let isDragging=false, startX=0, startW=240;

 resizer.addEventListener('mousedown',e=>{
  isDragging=true;
  startX=e.clientX;
  const col=$('colLeft');
  startW=col?col.getBoundingClientRect().width:240;
  resizer.classList.add('dragging');
  document.body.style.cursor='col-resize';
  document.body.style.userSelect='none';
 });

 window.addEventListener('mousemove',e=>{
  if(!isDragging)return;
  const dx=e.clientX-startX;
  const newW=Math.max(160,Math.min(480,startW+dx));
  document.documentElement.style.setProperty('--left-w',newW+'px');
 });

 window.addEventListener('mouseup',()=>{
  if(!isDragging)return;
  isDragging=false;
  resizer.classList.remove('dragging');
  document.body.style.cursor='';
  document.body.style.userSelect='';
 });
}

/* ============ BRIDGE + BOOT ============ */
function initBridge(tries){
 tries=tries||0;
 if(B)return;
 if(typeof qt!=='undefined'&&qt.webChannelTransport&&typeof QWebChannel!=='undefined'&&!window.__bt){
  window.__bt=true;
  try{new QWebChannel(qt.webChannelTransport,ch=>{
   B=ch.objects.bridge;window._bridge=B;
   if(B.get_language)B.get_language(js=>{try{const d=JSON.parse(js);LANG=(d.language==='en')?'en':'id'}catch(e){}
    bootData()});
   else bootData();
  })}catch(e){window.__bt=false}
 }
 if(!B&&tries<60)setTimeout(()=>initBridge(tries+1),100);
}

function bootData(){
 initResizer();
 initZoomGesture();
 loadFrames();
 loadFonts();
 loadThemes();
 loadCanvases();
 loadActivePreset();
}

window.addEventListener('DOMContentLoaded',()=>{
 initResizer();
 initZoomGesture();
 initBridge();
 applyI18n();
});
