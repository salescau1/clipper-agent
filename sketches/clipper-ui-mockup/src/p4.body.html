  <div class="wrap">

    <!-- top action bar -->
    <div class="bar">
      <div class="grow"></div>
      <!-- Status bar teks: autosave draf sudah dibuang (Item 25), jadi elemen ini
           SENGAJA dibiarkan kosong. Jangan menulis "Menyimpan draf..." ke sini lagi. -->
      <span class="hint" id="applyState"></span>
      <button class="btn sm" id="bRandom" onclick="randomStyle()">🎲 <span data-i18n="random">Random</span></button>
      <button class="btn pri" id="bSaveTheme" onclick="saveTheme()">💾 <span data-i18n="saveTheme">Simpan theme</span></button>
    </div>

    <div class="grid">

      <!-- LEFT: Library sidebar (Urutan Baku: Frame -> Font -> Sticker -> Theme) -->
      <aside class="col" id="colLeft">
        <div class="chead">
          <span class="t" data-i18n="library">Library</span>
          <span class="tslabel" data-i18n="thumbSize">Thumbnail Size</span>
          <div class="thumb-sizes">
            <button class="btn sm ico" id="bThumbSmall" onclick="setThumbSize('small')"
                    data-i18n-title="thumbSmall" title="Kecil">
              <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><rect x="3.5" y="3.5" width="5" height="5" rx="1" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
            </button>
            <button class="btn sm ico on" id="bThumbNorm" onclick="setThumbSize('normal')"
                    data-i18n-title="thumbNormal" title="Normal">
              <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><rect x="1.5" y="1.5" width="9" height="9" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
            </button>
          </div>
        </div>

        <div id="libraryScroll">
          
          <!-- 1. FRAME ACCORDION (Wajib Teratas) -->
          <div class="acc on" id="accFrame">
            <button class="acc-h" onclick="toggleLibAcc('accFrame')">
              <span data-i18n="frames">Frame</span>
              <span class="chev">▾</span>
            </button>
            <div class="acc-b">
              <div class="lib-actions">
                <button class="btn sm" onclick="importFrame()">＋ <span data-i18n="import">Import</span></button>
              </div>
              <div id="frameGrid" class="cards thumb-norm"></div>
            </div>
          </div>

          <!-- 2. FONT ACCORDION -->
          <div class="acc" id="accFont">
            <button class="acc-h" onclick="toggleLibAcc('accFont')">
              <span data-i18n="secFont">Font</span>
              <span class="chev">▾</span>
            </button>
            <div class="acc-b">
              <div class="lib-actions">
                <button class="btn sm" onclick="importFont()">＋ <span data-i18n="import">Import</span></button>
                <button class="btn sm" onclick="openFontsFolder()" data-i18n-title="openFolder" title="Buka folder">📁</button>
                <button class="btn sm" onclick="loadFonts(true)" data-i18n-title="refresh" title="Refresh">↻</button>
              </div>
              <div class="hint" id="fontCount" style="margin-bottom:4px"></div>
              <div id="fontList" class="flist"></div>
            </div>
          </div>

          <!-- 3. STICKER ACCORDION -->
          <div class="acc" id="accSticker">
            <button class="acc-h" onclick="toggleLibAcc('accSticker')">
              <span data-i18n="secPng">Sticker</span>
              <span class="chev">▾</span>
            </button>
            <div class="acc-b">
              <div class="lib-actions">
                <button class="btn sm" onclick="importOverlay()">＋ <span data-i18n="import">Import</span></button>
              </div>
              <div class="hint" id="overlayStatus" style="margin-bottom:4px"></div>
              <div id="overlayGrid" class="cards thumb-norm"></div>
            </div>
          </div>

          <!-- 4. THEME ACCORDION (Wajib Terbawah).
               TIDAK ADA tombol "Simpan Theme" di sini: tombol itu sudah ada di bar atas
               (#bSaveTheme). Dua tombol dengan nama sama di satu halaman adalah bug yang
               user tunjuk sendiri (bug.txt P4.18). -->
          <div class="acc on" id="accTheme">
            <button class="acc-h" onclick="toggleLibAcc('accTheme')">
              <span data-i18n="themes">Theme</span>
              <span class="chev">▾</span>
            </button>
            <div class="acc-b">
              <div id="themeGrid" class="cards thumb-norm"></div>
            </div>
          </div>

        </div>
      </aside>

      <!-- RESIZER DIVIDER -->
      <div class="resizer" id="resizerLeft" data-i18n-title="resizeLib" title="Tarik untuk ubah lebar library"></div>

      <!-- MIDDLE: toolbar + preview -->
      <main class="col mid">
        <div class="mbar">
          <div class="seg" id="viewSeg">
            <button id="tabAdj" class="on" onclick="setView('adjust')" data-i18n="adjustment">Adjustment</button>
            <button id="tabOut" onclick="setView('output')" data-i18n="output">Output</button>
          </div>
          <div class="mid" id="viewLabel" data-i18n="inputAdjustment">Input Adjustment</div>
          <div class="zoom">
            <button class="zb" onclick="zoomStep(-1)">−</button>
            <input id="zoomRange" type="range" min="40" max="250" step="5" value="100" oninput="setZoom(this.value)">
            <button class="zb" onclick="zoomStep(1)">+</button>
            <span class="v" id="zoomVal">100%</span>
            <button class="zb" onclick="setZoom(100)" data-i18n-title="reset" title="Reset">⟲</button>
          </div>
        </div>
        <div class="vp" id="previewViewport">
          <div id="stage">
            <div class="rc adjust" id="rcA">
              <div class="safe on"></div><div class="cropwin"></div>
              <div class="vid">VIDEO</div>
              <img class="tlayer sublayer" alt=""><img class="tlayer wmlayer" alt=""><img class="tlayer headlayer" alt="">
              <div class="ic empty"></div>
            </div>
            <div class="rc output" id="rcB" style="display:none">
              <div class="safe"></div>
              <div class="vid">VIDEO</div>
              <img class="tlayer sublayer" alt=""><img class="tlayer wmlayer" alt=""><img class="tlayer headlayer" alt="">
              <div class="ic empty"></div>
            </div>
          </div>
        </div>
      </main>

      <!-- RIGHT: Style panel -->
      <aside class="col" id="colRight">
        <div class="chead">
          <span class="t" data-i18n="style">Style</span>
          <span class="sw on" id="safeSw" onclick="toggleSafe()"></span>
          <span class="hint" data-i18n="safeArea">Safe area</span>
        </div>
        <div class="scroll" id="inspector"></div>
      </aside>

    </div>
  </div>
  <div id="toast" class="toast"></div>
