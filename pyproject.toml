[project]
name = "clipper"
version = "0.1.0"
description = "YouTube-to-short-video pipeline: curate, download, render, subtitle."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "yt-dlp>=2025.1.1",
    "openai-whisper>=20250625",
    "youtube-transcript-api>=1.0",
    "opencv-python>=4.8",
    "mediapipe>=0.10",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]